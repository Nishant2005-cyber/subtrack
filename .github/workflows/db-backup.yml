name: Database Snapshot Backup

on:
  schedule:
    # Run every night at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running manual backup'
        required: false
        default: 'Manual snapshot'

permissions:
  contents: read

jobs:
  backup:
    name: Execute Database Backup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json


      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Database Backup Script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run db:backup

      - name: Upload Backup Artifacts

        uses: actions/upload-artifact@v4
        with:
          name: "subtrack-database-backup-${{ github.run_number }}"
          path: backups/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
